---
version: 2
registries:
  dockerhub:
    type: docker-registry
    url: registry.hub.docker.com
    username: ${{ secrets.DOCKERHUB_USER }}
    password: ${{ secrets.DOCKERHUB_TOKEN }}
  dhi:
    type: docker-registry
    url: dhi.io
    username: ${{ secrets.DOCKERHUB_USER }}
    password: ${{ secrets.DOCKERHUB_TOKEN }}

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    registries:
      - dockerhub
      - dhi
    directory: .devcontainer
    schedule:
      interval: weekly

  - package-ecosystem: docker
    registries:
      - dockerhub
      - dhi
    directory: components/devcontainer
    schedule:
      interval: weekly

  - package-ecosystem: docker
    registries:
      - dockerhub
      - dhi
    directory: components/folderslint
    schedule:
      interval: weekly

  - package-ecosystem: docker
    registries:
      - dockerhub
      - dhi
    directory: components/ftp-client
    schedule:
      interval: weekly

  - package-ecosystem: docker
    registries:
      - dockerhub
      - dhi
    directory: components/revealjs
    schedule:
      interval: weekly

  - package-ecosystem: docker
    registries:
      - dockerhub
      - dhi
    directory: components/zensical
    schedule:
      interval: weekly

  # Pinned tool images of the CVE page (cve-* services). When anchore/grype is bumped, the vendored
  # grype HTML template must be bumped too (docs/cve-page/templates/) - the scan fails until it matches.
  - package-ecosystem: docker-compose
    registries:
      - dockerhub
    directory: /
    schedule:
      interval: weekly
