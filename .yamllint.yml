---
extends: default

ignore: |
  node_modules
  .vagrant
  target
  docs/cve-page/work
  docs/cve-page/cache
  docs/cve-page/public
  components/*/test/inspec/vendor

rules:
  line-length:
    max: 150
    allow-non-breakable-inline-mappings: true
    level: warning
  new-lines:
    type: unix
  braces:
    max-spaces-inside: 1
    level: error
  brackets:
    max-spaces-inside: 1
    level: error
