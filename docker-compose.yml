---
x-volumes: &volumes
  - /etc/timezone:/etc/timezone:ro
  - /etc/localtime:/etc/localtime:ro
  - project-root-volume:/workspaces/container-images
x-workdir: &default-workdir /workspaces/container-images
x-tty: &tty true

volumes:

  project-root-volume:
    driver: local
    driver_opts:
      type: none
      device: .
      o: bind

services:

  lint-yaml:
    image: cytopia/yamllint:latest
    volumes: *volumes
    working_dir: *default-workdir
    command: .
    tty: *tty

  lint-workflows:
    image: rhysd/actionlint:latest
    volumes: *volumes
    working_dir: *default-workdir
    command:
      - -color
      - .github/workflows/codeql.yml
      - .github/workflows/dev-environment.yml
      - .github/workflows/docs.yml
      - .github/workflows/housekeeping-issues.yml
      - .github/workflows/housekeeping-labels.yml
      - .github/workflows/housekeeping-project.yml
      - .github/workflows/pipeline.yml
      - .github/workflows/release.yml
    tty: *tty

  lint-filenames:
    image: lslintorg/ls-lint:1.11.2
    volumes: *volumes
    working_dir: *default-workdir
    tty: *tty

  lint-folders:
    image: sommerfeldio/folderslint:latest
    volumes: *volumes
    working_dir: *default-workdir
    command: .
    tty: *tty

  lint-markdown-links:
    image: lycheeverse/lychee:latest
    volumes: *volumes
    working_dir: *default-workdir
    command: --config .lychee.toml .
    tty: *tty

  inspec:
    # template service to run from taskfile.yml
    # not intended to be run directly
    image: &inspec-image chef/inspec:5.22.76
    volumes: *volumes
    working_dir: *default-workdir
    tty: *tty

  devcontainer-lint-dockerfile:
    image: &lint-dockerfile-image hadolint/hadolint:latest
    volumes: *volumes
    working_dir: *default-workdir
    entrypoint: hadolint components/devcontainer/Dockerfile
    tty: *tty

  devcontainer:
    image: local/devcontainer:${DEV_TAG}
    build:
      context: components/devcontainer
      dockerfile: Dockerfile
      target: base
    tty: *tty

  devcontainer-ansible:
    image: local/devcontainer:${DEV_TAG}-ansible
    build:
      context: components/devcontainer
      dockerfile: Dockerfile
      target: ansible
    tty: *tty

  devcontainer-go:
    image: local/devcontainer:${DEV_TAG}-go
    build:
      context: components/devcontainer
      dockerfile: Dockerfile
      target: go
    tty: *tty

  folderslint-lint-dockerfile:
    image: &lint-dockerfile-image hadolint/hadolint:latest
    volumes: *volumes
    working_dir: *default-workdir
    entrypoint: hadolint components/folderslint/Dockerfile
    tty: *tty

  folderslint:
    image: local/folderslint:${DEV_TAG}
    build:
      context: components/folderslint
      dockerfile: Dockerfile
    volumes: *volumes
    working_dir: *default-workdir
    command: .
    tty: *tty

  ftp-client-lint-dockerfile:
    image: *lint-dockerfile-image
    volumes: *volumes
    working_dir: *default-workdir
    entrypoint: hadolint components/ftp-client/Dockerfile
    tty: *tty

  ftp-client:
    image: local/ftp-client:${DEV_TAG}
    build:
      context: components/ftp-client
      dockerfile: Dockerfile
    tty: *tty

  revealjs-lint-dockerfile: &revealjs-lint-dockerfile
    image: *lint-dockerfile-image
    volumes: *volumes
    working_dir: *default-workdir
    entrypoint: hadolint components/revealjs/Dockerfile
    tty: *tty

  revealjs:
    image: local/revealjs:${DEV_TAG}
    build:
      context: components/revealjs
      dockerfile: Dockerfile
      target: serve
    volumes: *volumes
    working_dir: *default-workdir
    tty: *tty

  zensical-lint-dockerfile:
    image: *lint-dockerfile-image
    volumes: *volumes
    working_dir: *default-workdir
    entrypoint: hadolint components/zensical/Dockerfile
    tty: *tty

  zensical:
    image: local/zensical:${DEV_TAG}
    build:
      context: components/zensical
      dockerfile: Dockerfile
    volumes: *volumes
    working_dir: *default-workdir
    tty: *tty

  # ---------------------------------------------------------------------------

  docs-build:
    image: &zensical-docs-image sommerfeldio/zensical:latest
    volumes: *volumes
    working_dir: *default-workdir
    command: build
    tty: *tty

  docs-dev-server:
    image: *zensical-docs-image
    volumes: *volumes
    working_dir: *default-workdir
    command: serve --dev-addr 0.0.0.0:8000
    ports:
      - 3080:8000
    tty: *tty

  # ----- CVE page (docs/cve-page/) ----------------------------------------------
  # Template services, run from docs/taskfile.yml (via docs/cve-page/scripts/*.sh).
  # CVE_UID/CVE_GID are set by the scripts to the calling user (no root-owned output).
  # CVE_DOCKER_CONFIG_DIR: Docker config (auth only) prepared by docs/cve-page/scripts/lib.sh, read-only.

  cve-yq:
    image: mikefarah/yq:4.54.3
    pull_policy: missing
    user: &cve-user ${CVE_UID:-1000}:${CVE_GID:-1000}
    volumes:
      - project-root-volume:/workspaces/container-images
    working_dir: &cve-workdir /workspaces/container-images/docs/cve-page

  cve-docker-cli:
    image: docker:29.10.0-cli
    pull_policy: missing
    user: *cve-user
    volumes:
      - project-root-volume:/workspaces/container-images
      - ${CVE_DOCKER_CONFIG_DIR:-~/.docker}:/run/docker-config:ro
    working_dir: *cve-workdir
    environment:
      HOME: /tmp
      DOCKER_CONFIG: /tmp/.docker
    # buildx needs a writable DOCKER_CONFIG, so only the auth file is copied
    entrypoint:
      - sh
      - -c
      - >-
        mkdir -p "$$DOCKER_CONFIG"
        && { [ ! -f /run/docker-config/config.json ] || cp /run/docker-config/config.json "$$DOCKER_CONFIG/"; }
        && exec docker "$$@"
      - docker

  cve-syft:
    image: anchore/syft:v1.57.2
    pull_policy: missing
    user: *cve-user
    volumes:
      - project-root-volume:/workspaces/container-images
      - ${CVE_DOCKER_CONFIG_DIR:-~/.docker}:/run/docker-config:ro
    working_dir: *cve-workdir
    environment:
      HOME: /tmp
      DOCKER_CONFIG: /run/docker-config
      SYFT_CHECK_FOR_APP_UPDATE: 'false'
      XDG_CACHE_HOME: /workspaces/container-images/docs/cve-page/cache/syft

  cve-grype:
    image: anchore/grype:v0.122.1
    pull_policy: missing
    user: *cve-user
    volumes:
      - project-root-volume:/workspaces/container-images
      - ${CVE_DOCKER_CONFIG_DIR:-~/.docker}:/run/docker-config:ro
    working_dir: *cve-workdir
    environment:
      HOME: /tmp
      DOCKER_CONFIG: /run/docker-config
      GRYPE_CHECK_FOR_APP_UPDATE: 'false'
      GRYPE_DB_AUTO_UPDATE: 'false'
      GRYPE_DB_CACHE_DIR: /workspaces/container-images/docs/cve-page/cache/grype
      XDG_CACHE_HOME: /workspaces/container-images/docs/cve-page/cache/grype-xdg

  cve-page:
    image: nginxinc/nginx-unprivileged:1.31.7-alpine
    pull_policy: missing
    user: *cve-user
    volumes:
      - ./docs/cve-page/public:/usr/share/nginx/html:ro
    tmpfs:
      - /tmp
      - /var/cache/nginx
    ports:
      - 127.0.0.1:3081:8080
